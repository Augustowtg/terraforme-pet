[package]
name = "terraforme-pet"
description = "Janela flutuante com o mascote do terraforme"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Augusto Wesley"]
repository = "https://github.com/Augustowtg/terraforme-pet"

[[bin]]
name = "terraforme-pet"
path = "src/main.rs"

[dependencies]
terraforme-core = { git = "https://github.com/Augustowtg/terraforme.git", branch = "main" }

# Só o Linux tem a janela por enquanto (o Windows está no ROADMAP.md do terraforme).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
